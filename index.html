<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Style AI Product Review Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen py-8 px-4 text-slate-100 font-sans">

    <div class="max-w-3xl mx-auto bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 md:p-8">
        <h1 class="text-2xl md:text-4xl font-extrabold text-center text-amber-400 mb-2">
            🎬 Full YouTube-Style Product Review
        </h1>
        <p class="text-center text-slate-400 mb-6 text-sm md:text-base">
            Kisi bhi product ki complete deep-dive jankari aur in-depth review Hindi me
        </p>

        <!-- Input Box -->
        <div class="space-y-4">
            <div>
                <input type="text" id="productInput" 
                    placeholder="Product ka exact naam likhein (e.g. Samsung Galaxy M34 5G, Boat Airdopes 141)" 
                    class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400 text-white placeholder-slate-400">
            </div>
            <button onclick="generateReview()" id="submitBtn"
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition duration-200 shadow-lg text-lg">
                🔥 In-Depth Review Generate Karein
            </button>
        </div>

        <!-- Loader -->
        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-amber-400 border-t-transparent"></div>
            <p class="text-amber-400 mt-4 text-base font-semibold">AI product ki poori detail analysis kar raha hai... Kripya 10-15 seconds wait karein.</p>
        </div>

        <!-- Review Output Box -->
        <div id="outputCard" class="hidden mt-8 p-6 bg-slate-900 border border-slate-700 rounded-xl">
            <div id="reviewContent" class="prose prose-invert max-w-none text-slate-200 space-y-4"></div>
            
            <a id="buyButton" href="#" target="_blank" 
                class="mt-6 inline-block w-full text-center bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow transition text-lg">
                🛒 Amazon Par Official Price & Offers Dekhein
            </a>
        </div>
    </div>

    <script>
        // API Key Environment Variables se automatic uthayega
        async function generateReview() {
            const productName = document.getElementById('productInput').value.trim();
            if (!productName) {
                alert('Kripya kisi product ka naam daalein!');
                return;
            }

            const loading = document.getElementById('loading');
            const outputCard = document.getElementById('outputCard');
            const reviewContent = document.getElementById('reviewContent');
            const buyButton = document.getElementById('buyButton');
            const submitBtn = document.getElementById('submitBtn');

            loading.classList.remove('hidden');
            outputCard.classList.add('hidden');
            submitBtn.disabled = true;

            const promptText = `Aap YouTube ke sabse top tech aur product reviewer hain. 
Product: "${productName}" ka ek bilkul detailed, technical aur YouTube Script style me full review Hindi me likhein. 

Jisme ye sabhi sections detail me cover hon:
1. 🌟 Overall Score & Verdict Summary
2. 📦 Unboxing & Build Quality
3. 🔬 Full Technical Specifications
4. ⚡ Performance & Real-World Test
5. 📸 Camera / Display / Sound Quality
6. ✅ Kyun Kharidna Chahiye (Detailed Pros)
7. ❌ Kyun Nahi Kharidna Chahiye (Detailed Cons)
8. 🎯 Kiske Liye Sahi Hai (Who Should Buy?)

Style energetic, professional aur clear Hinglish/Hindi rakhein.`;

            try {
                // Direct call using latest working gemini-2.5-flash model
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productName })
                });

                const data = await res.json();
                
                if (res.ok && data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReview = data.candidates[0].content.parts[0].text;
                    reviewContent.innerHTML = marked.parse(aiReview);
                    buyButton.href = `https://www.amazon.in/s?k=${encodeURIComponent(productName)}`;
                    outputCard.classList.remove('hidden');
                } else {
                    alert('Error: ' + (data.error || 'Response generate nahi ho paya.'));
                }
            } catch (error) {
                alert('Server Connection Error!');
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
